name: Publish to MCP Registry

# Publishes integrations/mcp/server.json to the official MCP Registry
# (registry.modelcontextprotocol.io) using GitHub OIDC for the
# io.github.agentzeny/* namespace. The underlying npm package
# (snap-mcp-server) is published separately to npm.

on:
  workflow_dispatch:
  push:
    tags: ["mcp-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC authentication
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate integrations/mcp/server.json

      - name: Authenticate and publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish integrations/mcp/server.json
